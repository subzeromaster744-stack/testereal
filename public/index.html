<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓</text></svg>"><title>Escala de Hora Extra</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#e1e4ea;--pr:#2457d6;--ok:#17803d;--okb:#e3f5ea;--wa:#b45309;--wab:#fdf0d9;--er:#c0262d;--erb:#fde6e6;--t1:#2457d6;--t2:#0e8f7e;--t3:#8a4fd6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151c;--card:#1b2029;--tx:#e8ebf2;--mu:#98a2b3;--bd:#2c3340;--pr:#4d77e8;--ok:#5fd18a;--okb:#16301f;--wa:#f2b45c;--wab:#38290f;--er:#ff7b80;--erb:#3a1a1c;--t1:#8aa9ff;--t2:#4fd1bf;--t3:#b78bff}}
:root[data-theme=dark]{--bg:#12151c;--card:#1b2029;--tx:#e8ebf2;--mu:#98a2b3;--bd:#2c3340;--pr:#4d77e8;--ok:#5fd18a;--okb:#16301f;--wa:#f2b45c;--wab:#38290f;--er:#ff7b80;--erb:#3a1a1c;--t1:#8aa9ff;--t2:#4fd1bf;--t3:#b78bff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:0 0 8px}
.mu{color:var(--mu);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,input,select,textarea{font:inherit;color:inherit}
.tab,.btn{border:1px solid var(--bd);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer}
.tab.on,.btn.pr{background:var(--pr);border-color:var(--pr);color:#fff}
.btn.er{color:var(--er)}.btn.ok{background:var(--okb);color:var(--ok);border-color:var(--ok)}.btn.cf{background:var(--erb);color:var(--er);border-color:var(--er)}
main{max-width:1200px;margin:0 auto;padding:16px}
input,select,textarea{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:7px 9px;max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-bottom:14px}
.kpi,.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.card{margin-bottom:14px}.kpi b{display:block;font-size:22px}.kpi span{color:var(--mu);font-size:12px}
.kpi.cf b{color:var(--er)}.kpi.vz b{color:var(--wa)}
.proc{margin-bottom:18px}.proc h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.m{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--bd);border-radius:10px;padding:10px}
.m.ok{border-top-color:var(--ok)}.m.cf{border-top-color:var(--er);background:var(--erb)}.m.vz{border-top-color:var(--wa)}
.m h3{font-size:14px;margin:0 0 2px;display:flex;justify-content:space-between;gap:6px}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.cf{background:var(--erb);color:var(--er)}.tag.vz{background:var(--wab);color:var(--wa)}
.chip{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 8px;margin-top:4px;cursor:pointer}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}
.t{font-size:11px;font-weight:700}.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.chip.on .t{color:#fff}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px}
td input,td select{width:100%;min-width:90px}
.bb{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:80px}.bb i{display:block;height:100%;background:var(--ok)}
.empty{text-align:center;padding:40px 16px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:8px;display:none;z-index:9}
.lk{color:var(--pr);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
.chip.alt{opacity:.65;border-style:dashed}.mc{white-space:normal;min-width:240px}.tag .lk{text-decoration:none;font-weight:700;color:inherit}
.cal{border-collapse:separate;border-spacing:0;font-size:12px}
.cal th,.cal td{border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);padding:4px 6px;vertical-align:top;white-space:normal}
.cal .first{position:sticky;left:0;z-index:2;background:var(--card);min-width:150px;max-width:170px;text-align:left}
.cal .dh{text-align:center;cursor:pointer;min-width:var(--cw);font-weight:400;background:var(--card)}.cal .dh.fds{background:var(--bg)}.cal .dh.hoje{background:var(--pr);color:#fff}
.cal .c{cursor:pointer;min-width:var(--cw);max-width:var(--cw)}.cal .c.ok{background:var(--okb)}.cal .c.cf{background:var(--erb)}.cal .c.vz{background:var(--wab)}
.cal tr.pr .first{background:var(--bg);font-weight:600}.cal .sub{padding-left:22px}.cal tr.tot .first{background:var(--bg)}
.cn{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cal .lk{font-size:13px;color:var(--tx);text-decoration:none}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8),iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),fmt=k=>k.split('-').reverse().join('/');
let cfg={machines:[],employees:[]},days={},db=null,tab='escala',date=iso(new Date()),flt=0,per=30;
const ls={get(k){try{return JSON.parse(localStorage.getItem('escalaHE:'+k))}catch{return null}},set(k,v){try{localStorage.setItem('escalaHE:'+k,JSON.stringify(v))}catch{}}};
const D=d=>days[d]||{s:[],a:{},m:{}},emp=id=>cfg.employees.find(e=>e.id===id),mac=id=>cfg.machines.find(m=>m.id===id);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',3200)}
let ver='',busy=0;
const hd=()=>({'content-type':'application/json','x-key':ls.get('key')||''});
let sync={s:'wait'};
async function call(body,q,tried){const r=await fetch('/api/state'+(q||''),body?{method:'POST',headers:hd(),body:JSON.stringify(body)}:{headers:hd(),cache:'no-store'});
 if(r.status==401){if(!call.no){const k=prompt(tried?'Código incorreto. Digite novamente (ou cancele):':'Código de acesso:');if(k){ls.set('key',k.trim());return call(body,q,1)}call.no=true}throw 401}
 if(!r.ok)throw r.status;return r.json()}
function syl(){const x=sync,b=' <button class="lk" data-a="sync">Sincronizar agora</button>';
 if(x.s=='ok')return '● Dados compartilhados entre os gestores · sincronizado às '+x.t.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+b;
 if(x.s=='wait')return 'Conectando ao servidor…';
 const m={e503:'o banco D1 não está ligado ao Worker (confira o binding DB e o ID do banco em d1_databases no wrangler.jsonc)',e404:'a API /api/state não foi encontrada (o código da API não foi publicado; confira o wrangler.jsonc e o nome do Worker)',e401:'código de acesso não informado ou incorreto'}[x.s]||'sem conexão com o servidor ('+E(x.c&&x.c.message||x.c)+')';
 return '<span style="color:var(--er)">⚠ Não sincronizado: '+m+'.</span> Os dados estão sendo salvos só neste navegador.'+b}
function setSy(){const e=$('#sy');if(e)e.innerHTML=syl()}
async function saveCfg(){ls.set('cfg',cfg);if(!db)return;busy++;try{await call({t:'cfg',data:cfg})}catch{toast('Não foi possível salvar no servidor')}busy--}
async function saveDay(d){ls.set('days',days);if(!db)return;busy++;try{await call({t:'day',date:d,data:days[d]})}catch{toast('Não foi possível salvar no servidor')}busy--}
async function pull(manual){if(busy)return;if(manual===true)call.no=false;
 try{const r=await call(null,ver?'?v='+encodeURIComponent(ver):''),first=!db;db=true;call.no=false;sync={s:'ok',t:new Date()};if(r.same)return setSy();ver=r.v;
 if(first&&!r.cfg&&(cfg.machines.length||cfg.employees.length)){saveCfg();Object.keys(days).forEach(saveDay);return render()}
 cfg=r.cfg||{machines:[],employees:[]};norm();days=r.days||{};rr();setSy()}
 catch(e){sync={s:e===401?'e401':e===503?'e503':e===404?'e404':'err',c:e};setSy()}}
function upd(d,fn){const x=JSON.parse(JSON.stringify(D(d)));fn(x);days[d]=x;saveDay(d);render()}
// Turno único: no sábado e no domingo só um turno trabalha, então todas as pessoas aparecem, de qualquer turno (cada uma mantém o turno do cadastro). A chave 'Turno único' vale por dia e muda o padrão (day.u: 1 liga, 0 desliga).
const wend=k=>[0,6].includes(new Date(k+'T12:00').getDay()),one=k=>{const u=D(k).u;return u==null?wend(k):!!u};
const shiftDate=n=>{const x=new Date(date+'T12:00');x.setDate(x.getDate()+n);return iso(x)};

function dbar(f){return `<div class="bar"><button class="btn" data-a="dd" data-v="-1">◀</button><input type="date" data-a="date" value="${date}"><button class="btn" data-a="dd" data-v="1">▶</button><button class="btn" data-a="today">Hoje</button><b style="text-transform:capitalize">${new Date(date+'T12:00').toLocaleDateString('pt-BR',{weekday:'long'})}</b>${secSel()}${f?`<span style="flex:1"></span>${one(date)?`<span class="tag ok" title="Só um turno trabalha neste dia: aparecem as pessoas de todos os turnos">Turno único · todos os turnos</span><button class="btn" data-a="uni" data-v="0" title="Voltar a filtrar por T1, T2 ou T3">Filtrar por turno</button>`:`${[[0,'Todos'],[1,'T1'],[2,'T2'],[3,'T3']].map(x=>`<button class="btn ${flt==x[0]?'pr':''}" data-a="flt" data-v="${x[0]}">${x[1]}</button>`).join('')}<button class="btn" data-a="uni" data-v="1" title="Só um turno trabalha neste dia: mostrar as pessoas de todos os turnos">Turno único</button>`}`:''}</div>`}
function noData(){return `<div class="card empty"><h2>Comece cadastrando máquinas e colaboradores</h2><p class="mu">Cadastre as máquinas (por grupo de processo) e os operadores de cada turno para montar a escala.</p><button class="btn pr" data-a="tab" data-v="cad">Ir para o Cadastro</button> <button class="btn" data-a="demo">Carregar dados de exemplo</button></div>`}

const wk=(e,d)=>{const w=(d.w||{})[e.id];return e.machines.includes(w)?w:(e.machines[0]||'')};
const counts=d=>{const c={};cfg.employees.forEach(e=>{if(d.s.includes(e.id)){const w=wk(e,d);c[w]=(c[w]||0)+1}});return c};
const norm=()=>{cfg.machines=(cfg.machines||[]).map(m=>{m.sec=m.sec||'';m.ct=m.ct||'';m.proc=m.proc||'Outros';return m});cfg.employees=(cfg.employees||[]).map(e=>{if(!e.machines)e.machines=e.machine?[e.machine]:[];delete e.machine;return e})};
// Seção: a máquina guarda a seção; a pessoa fica nas seções das máquinas em que é treinada. O filtro vale para Escala, Calendário, Presença e Cadastro.
const SN='__none';let secF=ls.get('sec')||'';
const secList=()=>[...new Set(cfg.machines.map(m=>m.sec).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
const sf=()=>{const l=secList();return secF&&(secF==SN?(l.length&&cfg.machines.some(m=>!m.sec)):l.includes(secF))?secF:''};
const mIn=m=>{const s=sf();return !s||(s==SN?!m.sec:m.sec===s)};
const eMs=e=>e.machines.map(mac).filter(Boolean);
const eIn=e=>{const s=sf();if(!s)return true;const ms=eMs(e);return ms.length?ms.some(mIn):s==SN};
const gk=m=>(m.sec||'')+'|'+(m.proc||'Outros');
const bySec=gs=>gs.sort((a,b)=>a.split('|')[0].localeCompare(b.split('|')[0],'pt-BR'));
const mlb=m=>(m.sec?m.sec+' · ':'')+(m.proc||'Outros')+' · '+m.name;
function secSel(){const l=secList();if(!l.length)return '';const s=sf();return `<label class="mu">Seção: <select data-a="sec"><option value="">Todas</option>${l.map(x=>`<option value="${E(x)}" ${s===x?'selected':''}>${E(x)}</option>`).join('')}${cfg.machines.some(m=>!m.sec)?`<option value="${SN}" ${s==SN?'selected':''}>(sem seção)</option>`:''}</select></label>`}
function vEscala(){
 if(!cfg.machines.length&&!cfg.employees.length)return dbar()+noData();
 const d=D(date),S=new Set(d.s),cnt=counts(d),s0=sf(),ms0=cfg.machines.filter(mIn),ids=new Set(ms0.map(m=>m.id)),U=one(date),FL=U?0:flt,bysh=(a,b)=>a.shift-b.shift||a.name.localeCompare(b.name,'pt-BR');
 const st=m=>{const n=cnt[m.id]||0;return n>(m.slots||1)?'cf':n?'ok':'vz'};
 const sc=cfg.employees.filter(e=>S.has(e.id)&&(!s0||(wk(e,d)?ids.has(wk(e,d)):s0==SN)));
 const sh=[1,2,3].map(t=>sc.filter(e=>e.shift==t).length);
 const cf=ms0.filter(m=>st(m)=='cf').length,vz=ms0.filter(m=>st(m)=='vz');
 const chip=(e,mid)=>{const on=S.has(e.id),w=wk(e,d),here=on&&w==mid,el=on&&!here;return `<button class="chip ${here?'on':''} ${el?'alt':''}" data-a="tog" data-id="${e.id}" data-v="${mid}"><span class="t t${e.shift}">T${e.shift}</span>${E(e.name)}<span style="margin-left:auto;font-size:11px;opacity:.85">${el?'→ '+E((mac(w)||{}).name):e.machines.length>1?e.machines.length+' máq.':''}</span></button>`};
 const card=m=>{const s=st(m),es=cfg.employees.filter(e=>e.machines.includes(m.id)&&(!FL||e.shift==FL)).sort(bysh);return `<div class="m ${s}"><h3><span>${E(m.name)}${m.ct&&m.ct!==m.name?` <span class="mu">CT ${E(m.ct)}</span>`:''}</span><span class="tag ${s}">${{cf:'Conflito',ok:'Coberta',vz:'Sem operador'}[s]}</span></h3><div class="mu">Vagas: ${cnt[m.id]||0}/${m.slots||1}</div>${es.map(e=>chip(e,m.id)).join('')||'<div class="mu" style="margin-top:6px">Sem operadores neste filtro</div>'}</div>`};
 const gs=bySec([...new Set(ms0.map(gk))]);
 const orphan=cfg.employees.filter(e=>!e.machines.some(i=>mac(i))&&(!FL||e.shift==FL)).sort(bysh);
 return dbar(1)+(s0?`<div class="mu" style="margin-bottom:10px">Mostrando ${s0==SN?'as máquinas sem seção':'a seção <b>'+E(s0)+'</b>'}: ${ms0.length} máquina(s) e ${cfg.employees.filter(eIn).length} pessoa(s) treinada(s) nelas.</div>`:'')+(cfg.employees.some(e=>e.machines.length>1)?`<div class="mu" style="margin-bottom:10px">Quem é treinado em mais de uma máquina aparece em todas elas. Clique na máquina onde a pessoa vai trabalhar; clicar em outra máquina dela troca o posto.</div>`:'')+(U?`<div class="mu" style="margin-bottom:10px">Turno único neste dia: aparecem as pessoas de todos os turnos. Cada uma mantém o turno do cadastro (T1, T2, T3).</div>`:'')+`<div class="kpis"><div class="kpi"><b>${sc.length}</b><span>Escalados</span></div>${U?'':sh.map((n,i)=>`<div class="kpi"><b>${n}</b><span>Turno ${i+1}</span></div>`).join('')}<div class="kpi ${cf?'cf':''}"><b>${cf}</b><span>Máquinas em conflito</span></div><div class="kpi ${vz.length?'vz':''}"><b>${vz.length}</b><span>Máquinas sem operador</span></div></div>`+
 (cf?`<div class="card" style="border-color:var(--er);color:var(--er)">⚠ Há mais operadores escalados do que vagas na mesma máquina — alguém ficaria sem máquina. Mude o posto de um deles (se for treinado em outra máquina) ou escale outra pessoa.</div>`:'')+
 (vz.length?`<div class="card"><b>Ainda sem operador:</b> <span class="mu" style="font-size:13px">${vz.map(m=>E(m.name)).join(', ')}</span></div>`:'')+
 gs.map(g=>{const ms=ms0.filter(m=>gk(m)==g),ok=ms.filter(m=>st(m)!='vz').length,m0=ms[0],t=(!s0&&m0.sec?E(m0.sec)+' · ':'')+E(m0.proc||'Outros');return `<section class="proc"><h2>${t} <span class="tag ${ok==ms.length?'ok':'vz'}">${ok}/${ms.length} máquinas cobertas</span></h2><div class="grid">${ms.map(card).join('')}</div></section>`}).join('')+
 ((!s0||s0==SN)&&orphan.length?`<section class="proc"><h2>Sem máquina definida</h2><div class="grid"><div class="m">${orphan.map(e=>chip(e,'')).join('')}</div></div></section>`:'')}

function vPres(){
 const d=D(date),c=counts(d),s0=sf(),ids=new Set(cfg.machines.filter(mIn).map(m=>m.id)),l=d.s.map(emp).filter(Boolean).filter(e=>!s0||(wk(e,d)?ids.has(wk(e,d)):s0==SN)).sort((a,b)=>a.shift-b.shift||a.name.localeCompare(b.name));
 const p=l.filter(e=>d.a[e.id]=='p').length,f=l.filter(e=>d.a[e.id]=='f').length,r=l.filter(e=>d.m[e.id]).length;
 return dbar()+`<div class="kpis"><div class="kpi"><b>${l.length}</b><span>Escalados</span></div><div class="kpi"><b>${p}</b><span>Presentes</span></div><div class="kpi ${f?'cf':''}"><b>${f}</b><span>Faltas</span></div><div class="kpi"><b>${l.length-p-f}</b><span>Pendentes</span></div><div class="kpi"><b>${r}</b><span>Refeições reservadas</span></div></div>`+
 (l.length?`<div class="card sc"><table><tr><th>Turno</th><th>Colaborador</th><th>Vai trabalhar em</th><th>Refeição</th><th>Check-in</th></tr>${l.map(e=>{const a=d.a[e.id],w=wk(e,d),m=mac(w),cf=m&&c[w]>(m.slots||1);return `<tr><td><span class="t t${e.shift}">T${e.shift}</span></td><td>${E(e.name)}</td><td>${e.machines.length>1?`<select data-a="wk" data-id="${e.id}">${e.machines.map(i=>`<option value="${i}" ${i==w?'selected':''}>${E((mac(i)||{}).name)}</option>`).join('')}</select>`:m?E(m.name):'—'} ${cf?'<span class="tag cf">conflito</span>':''}</td><td><label><input type="checkbox" data-a="meal" data-id="${e.id}" ${d.m[e.id]?'checked':''}> Reservada</label></td><td><button class="btn ${a=='p'?'ok':''}" data-a="att" data-v="p" data-id="${e.id}">Presente</button> <button class="btn ${a=='f'?'cf':''}" data-a="att" data-v="f" data-id="${e.id}">Faltou</button></td></tr>`}).join('')}</table></div>`:`<div class="card empty mu">Ninguém escalado para esta data${s0?' nesta seção':''}. Monte a escala na aba "Escala".</div>`)}

function vInd(){
 const z=()=>({e:0,p:0,f:0}),add=(o,v)=>{o.e++;if(v=='p')o.p++;if(v=='f')o.f++},pc=o=>o.p+o.f?Math.round(o.p/(o.p+o.f)*100)+'%':'—';
 const lim=per?iso(new Date(Date.now()-per*864e5)):'',T=z(),SH={1:z(),2:z(),3:z()},EM={},DY=[];
 Object.keys(days).filter(k=>k>=lim).sort().reverse().forEach(k=>{const d=days[k],o=z();(d.s||[]).forEach(id=>{const e=emp(id),v=(d.a||{})[id];add(T,v);add(o,v);if(e&&SH[e.shift])add(SH[e.shift],v);add(EM[id]=EM[id]||z(),v)});DY.push([k,o])});
 const rows=Object.entries(EM).sort((a,b)=>b[1].f-a[1].f||b[1].e-a[1].e);

 return `<div class="bar"><button class="btn" data-a="cnav" data-v="-1">◀</button><button class="btn" data-a="cnav" data-v="1">▶</button><button class="btn" data-a="ctoday">Hoje</button><b style="text-transform:capitalize;min-width:150px">${lbl}</b>${secSel()}<button class="btn ${calMode=='w'?'pr':''}" data-a="cmode" data-v="w">Semana</button><button class="btn ${calMode=='m'?'pr':''}" data-a="cmode" data-v="m">Mês</button><span style="flex:1"></span><button class="btn" data-a="openall">Expandir tudo</button><button class="btn" data-a="closeall">Recolher tudo</button></div>
 <div class="card sc" style="padding:0"><table class="cal" style="--cw:${calMode=='m'?'66px':'118px'}">${head}${tot}${body}</table></div>
 <div class="mu"><span class="tag ok">verde</span> todas as máquinas do grupo cobertas &nbsp;<span class="tag vz">âmbar</span> parte das máquinas cobertas &nbsp;<span class="tag cf">vermelho</span> conflito (mais gente que vagas) &nbsp;·&nbsp; ✓ presente &nbsp;✗ faltou &nbsp;·&nbsp; clique em um dia para abrir a escala dele. Use ▸ para ver as máquinas de cada grupo.</div>`}

 else if(a=='cmode'){calMode=v;render()}
 else if(a=='ctoday'){calRef=iso(new Date());render()}
 else if(a=='cnav'){if(calMode=='w')calRef=cd(calRef,7*v);else{const r=wd(calRef);r.setDate(1);r.setMonth(r.getMonth()+ +v);calRef=iso(r)}render()}

 else if(a=='adde'){if(!g('#en'))return toast('Informe o nome do colaborador');cfg.employees.push({id:uid(),name:g('#en'),shift:+$('#es').value,machines:$('#em').value?[$('#em').value]:[]});saveCfg();render()}
 else if(a=='delm'){cfg.machines=cfg.machines.filter(m=>m.id!==id);cfg.employees.forEach(e=>e.machines=e.machines.filter(i=>i!==id));saveCfg();render()}
 else if(a=='dele'){cfg.employees=cfg.employees.filter(e=>e.id!==id);saveCfg();render()}
 else if(a=='rm'){const e=emp(id);e.machines=e.machines.filter(i=>i!==v);saveCfg();render()}
 else if(a=='ex'){bk='Nome;Turno;Máquinas\nAna Souza;1;Ret 01/Ret 02\nBruno Lima;T2;Estria 01\nCarlos Dias;Turno 3;Fres 01|Fres 02|Estria 01';parse();render()}

 else if(a=='demo'){const G=[['Retificadora','Eixos A','Ret 01','Ret 02','Ret 03'],['Estria','Eixos D','Estria 01','Estria 02'],['Fresadora','Eixos D','Fres 01','Fres 02']];G.forEach(g=>g.slice(2).forEach(n=>cfg.machines.push({id:uid(),name:n,ct:'',sec:g[1],proc:g[0],slots:1})));const M=cfg.machines,L=M.length;

});

  else{try{tx=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{tx=new TextDecoder('windows-1252').decode(buf)}}
  ctt=tx;ctr=ctRows(ctText(ctt));render()}catch(e){toast('Não consegui ler o arquivo: '+(e.message||e))}});t.value=''}
 else if(a=='file'&&t.files[0])t.files[0].arrayBuffer().then(buf=>{let x;try{x=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{x=new TextDecoder('windows-1252').decode(buf)}bk=x;bp=($('#bp')||{}).value||bp;parse();render()})
